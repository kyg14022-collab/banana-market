:root{
--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
--bg:#ffffff;--card:#f5f5f7;--card-h:#ececf0;--tx:#1d1d1f;--sub:#6e6e73;--line:#e3e3e8;--pri:#1d1d1f;--pri-t:#ffffff;--acc:#1d1d1f;

--ban:#ffd21f;--ban-t:#1d1d1f;--ban-win:#3a3a3e;
--m-bg:#dff6e8;--m-fg:#0f6b38;--j-bg:#e3ecff;--j-fg:#1f47c9;--g-bg:#fff0c2;--g-fg:#835300;--r-bg:#ffe3e3;--r-fg:#c21f1f;
--toast-bg:#1d1d1f;--toast-fg:#ffffff;--scrim:rgba(10,10,12,.5)}

--m-bg:#1b3a2a;--m-fg:#7fe0a6;--j-bg:#1f2b55;--j-fg:#9db8ff;--g-bg:#3d3114;--g-fg:#f5c85e;--r-bg:#4a2020;--r-fg:#ff9a9a;
--toast-bg:#f5f5f7;--toast-fg:#121214}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#121214;--card:#1d1d20;--card-h:#26262a;--tx:#f5f5f7;--sub:#a1a1a6;--line:#2c2c30;--pri:#ffd21f;--pri-t:#1d1d1f;--acc:#ffd21f;
--ok:#3a3110;--ok-t:#ffe37a;--seg:#1d1d20;--ring:rgba(255,210,31,.3);
--m-bg:#1b3a2a;--m-fg:#7fe0a6;--j-bg:#1f2b55;--j-fg:#9db8ff;--g-bg:#3d3114;--g-fg:#f5c85e;--r-bg:#4a2020;--r-fg:#ff9a9a;

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.7 var(--font);letter-spacing:-.012em;word-break:keep-all;-webkit-font-smoothing:antialiased}

.page{display:flex;align-items:flex-start;min-height:100vh}
.stage{flex:1 1 50%;position:sticky;top:0;height:100vh;background:var(--ban);color:var(--ban-t);display:flex;flex-direction:column;justify-content:space-between;padding:28px 32px;overflow:hidden}
.stage .name{align-self:flex-start;display:inline-block;font-size:clamp(32px,3.4vw,52px);line-height:1.1;font-weight:800;letter-spacing:-.045em;color:var(--ban);background:var(--ban-t);padding:.14em .38em .18em;border-radius:.32em;text-decoration:none}
.stage .mark{display:inline-block;font-weight:800;letter-spacing:-.04em;color:var(--ban);background:var(--ban-t);padding:.02em .3em .06em;border-radius:.28em;line-height:1.3}
.stage svg{display:block;width:min(56%,340px);height:auto;margin:0 auto}
.stage p{margin:0;font-size:clamp(20px,1.9vw,28px);line-height:1.4;font-weight:700;letter-spacing:-.03em;max-width:13em;text-wrap:balance}
.w{flex:1 1 50%;min-width:0;padding-block:28px 64px;padding-left:max(16px,clamp(16px,5vw,72px));padding-right:max(16px,clamp(16px,5vw,72px))}
#app{max-width:680px}
@media (max-width:900px){
 .page{display:block}
 .stage{position:relative;height:auto;flex-direction:row;align-items:center;gap:16px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .stage{flex-wrap:wrap}
 .stage .name{font-size:26px;align-self:center}
 .stage svg{width:56px;margin:0 0 0 auto;order:2}
 .stage p{order:3;flex-basis:100%;font-size:19px;max-width:none}
 .w{padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

h1{font-size:clamp(28px,3.2vw,46px);line-height:1.3;font-weight:700;letter-spacing:-.035em;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.35;font-weight:700;letter-spacing:-.03em;margin:88px 0 18px;text-wrap:balance}
.lead{margin:20px 0 0;font-size:18px;line-height:1.7;max-width:28em}
.sub{color:var(--sub);font-size:15.5px;line-height:1.5}
.hero{margin:0 0 56px}
.office{margin:0 0 10px;font-size:18px;line-height:1.4;font-weight:700;letter-spacing:-.02em}

.card{background:var(--card);border-radius:20px;padding:24px;margin:10px 0}
.card.item{display:block;cursor:pointer;color:var(--tx);text-decoration:none;transition:background .15s,transform .15s}
.card.item:active{transform:scale(.99)}
@media (hover:hover){.card.item:hover{background:var(--card-h)}}
.ihead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.ihead .pr{margin-left:auto}
.ihead>*{min-width:0}
.iname{font-size:19px;font-weight:700;letter-spacing:-.02em}
.pr{font-size:26px;font-weight:700;letter-spacing:-.035em;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.tg{font-weight:600;font-size:16px;margin:8px 0 4px}
.meta{margin-top:10px}
.tag{display:inline-block;background:var(--seg);color:var(--tx);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;margin-right:6px;line-height:1.5}
.tag.t-m{background:var(--m-bg);color:var(--m-fg)}.tag.t-j{background:var(--j-bg);color:var(--j-fg)}.tag.t-g{background:var(--g-bg);color:var(--g-fg)}.tag.t-r{background:var(--r-bg);color:var(--r-fg)}
.tag.t-c{background:var(--tx);color:var(--bg)}

.tabs{display:flex;gap:4px;padding:4px;background:var(--seg);border-radius:999px;margin:0 0 12px}
.tab{flex:1;min-width:0;text-align:center;padding:12px 4px;border-radius:999px;font-weight:600;font-size:15px;line-height:1.3;cursor:pointer;color:var(--sub);background:none;border:0;font-family:inherit;min-height:44px}
.tab.on{background:var(--bg);color:var(--tx)}

label{font-size:14.5px;font-weight:600;color:var(--sub);display:block;margin:16px 0 7px}
select{width:100%;min-height:50px;padding:12px 42px 12px 14px;border:0;border-radius:14px;background:var(--bg);appearance:none;-webkit-appearance:none;

select:focus{outline:0;box-shadow:0 0 0 3px var(--ring)}
.btn{display:block;width:100%;background:var(--pri);color:var(--pri-t);border:0;border-radius:999px;min-height:52px;padding:14px 22px;font-weight:600;font-size:17px;cursor:pointer;text-align:center;text-decoration:none;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.98)}@media (hover:hover){.btn:hover{filter:brightness(.92)}}
.btn.g{background:var(--bg);color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ban{background:var(--ban);color:var(--ban-t)}
.btn.inl{display:inline-block;width:auto}
.lnk{background:none;border:0;color:var(--tx);cursor:pointer;font-weight:600;font-size:15.5px;padding:10px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 18px;border-radius:999px;border:0;background:var(--bg);cursor:pointer;font-weight:500;font-size:15px;min-height:44px}
.chip.on{background:var(--pri);color:var(--pri-t);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid>*{min-width:0}
.grid .top2{margin-top:0}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:18px}

table{width:100%;border-collapse:collapse}th,td{padding:13px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child th,tr:last-child td{border-bottom:0}
th{width:34%;color:var(--sub);font-weight:500;font-size:15px}td{font-weight:500}

.letter{max-width:34em}
.letter p{margin:0 0 1.15em;font-size:17.5px;line-height:1.85;letter-spacing:-.005em}
.letter .call{margin:1.6em 0;font-size:20px;line-height:1.6;font-weight:700;letter-spacing:-.025em}
.letter .note{margin:0;font-size:14.5px;line-height:1.65;letter-spacing:0;color:var(--sub)}
.letter .sig{margin:2.2em 0 0;font-weight:700;line-height:1.6}

.bk{background:var(--card);border-radius:20px;padding:22px}
.bk-h{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:12px}
.bk dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 20px}.bk dl>div{min-width:0}.bk dl>div.wide{grid-column:1/-1}
.bk dt{font-size:13px;color:var(--sub)}.bk dd{margin:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}

.contact{background:var(--card);color:var(--tx);border-radius:24px;padding:28px}
.contact h3{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.contact .btn{background:var(--pri);color:var(--pri-t)}
.contact .btn.g{background:var(--bg);color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--line)}
.quote{margin:12px 0 4px;padding:12px 14px;background:var(--bg);border-radius:12px;color:var(--tx);font-size:15px;user-select:all}
.telbox{display:none;margin-top:10px;padding:14px;border-radius:14px;background:var(--bg);text-align:center;color:var(--tx)}
.telbox .num{font-size:28px;font-weight:800;margin:6px 0;user-select:all;font-variant-numeric:tabular-nums}

.xl{overflow-x:auto;background:var(--card);border-radius:20px}
.xt{font-size:15px;font-variant-numeric:tabular-nums}
.xt th,.xt td{width:auto;padding:13px 12px;vertical-align:middle}
.xt thead th{color:var(--sub);font-size:13px;font-weight:600;white-space:nowrap}
.xt tbody tr{cursor:pointer}
@media (hover:hover){.xt tbody tr:hover td{background:var(--card-h)}}
.xt td.num,.xt th.num{text-align:right;white-space:nowrap}.xt td.num{font-weight:800}

.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);color:var(--tx);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:13px 20px;border-radius:16px;z-index:30;max-width:90%;font-size:15px;font-weight:500}
.state{padding:40px 0;color:var(--sub)}
.demo{margin:20px 0 0;padding:12px 14px;border-radius:14px;background:var(--ok);color:var(--ok-t);font-size:14.5px;line-height:1.5}
.err{color:var(--r-fg);font-size:14px;margin-top:10px}

/* AI 매물찾기 채팅 */
.ai{margin:0}
/* 섹션 제목 띠: 섹션마다 같은 노란 띠로 구분 */
#app h2{display:flex;align-items:center;background:var(--ban);color:var(--ban-t);font-size:20px;line-height:1.35;font-weight:800;letter-spacing:-.03em;padding:12px 18px;border-radius:14px;margin:64px 0 16px}
#app .ai h2{margin-top:0}
.chatbox{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.log{display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:600px;overflow-y:auto;padding:8px 6px}
.bub{max-width:90%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}
.bub.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--pri);color:var(--pri-t);border-bottom-right-radius:6px}
.bub.wait{color:var(--sub)}
.cond{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px;white-space:normal}
.cond span{background:var(--ok);color:var(--ok-t);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:600;line-height:1.5}
.mini{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;padding:12px 14px;margin-top:6px;cursor:pointer;font:inherit;color:var(--tx);white-space:normal}
@media (hover:hover){.mini:hover{background:var(--card-h)}}
.mini b{font-size:16px;font-weight:700}
.mini .s{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.mini .p{font-weight:700;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bub .lnk{padding:6px 0;font-size:15px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;min-height:52px;padding:12px 18px;border:0;border-radius:999px;background:var(--bg);font:inherit;font-size:16px;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--line)}
.ask input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--tx)}
.ask .btn.send{width:56px;min-height:56px;height:56px;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.ask .btn.send:disabled{opacity:.5;cursor:default}
.ask input{min-height:56px}
.aimeta{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:13px;line-height:1.5;color:var(--sub);padding:0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
@media (max-width:420px){.grid{grid-template-columns:1fr}.grid .top2{margin-top:16px}.pr{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){.chatbox{padding:10px;gap:10px}.log{min-height:0;max-height:420px;padding:4px 2px}}
/* 휴대폰: 첫 화면에서 바로 검색창이 보이도록 위쪽을 촘촘하게 */
@media (max-width:900px){
 .stage{padding-block:12px}
 .stage .name{font-size:21px}
 .stage svg{width:40px}
 .stage p{font-size:16px;line-height:1.45}
 .w{padding-block:18px 48px}
 .office{font-size:15px;margin-bottom:4px}
 h1{font-size:24px}
 .lead{font-size:15.5px;line-height:1.6;margin-top:8px}
 .hero{margin-bottom:22px}
 #app h2{font-size:18px;padding:10px 14px;margin-top:44px;margin-bottom:12px}
 #app .ai h2{margin-top:0}
 .bub{padding:10px 14px;font-size:15.5px;line-height:1.6}
}
</style>

  /* ---------- 매물 상세 ---------- */
  function detail(l) {
    stat('listing', l.id);
    var c = C.find(function (x) { return x.n === l.cx; }) || { a: '', d: '' };
    var others = L.filter(function (x) { return x.cx === l.cx && x.deal === l.deal && x.id !== l.id; });
    var rows = [['소재지', [(l.addr || c.a || '서울 서초구 ' + c.d), l.cx, B.dong(l.bldg)].filter(Boolean).join(' ')], ['중개대상물 종류', '아파트'], ['거래형태', l.deal]]
      .concat(l.deal === '매매' && l.gap ? [['갭투 여부', l.gap === '갭투' ? '갭투 (임차인 있음)' : '입주 (실입주 가능)']] : [])
      .concat([['금액', price(l)], ['평형', ptxt(l)],
        ['면적', '전용 ' + l.area + '㎡ / 공급 ' + l.supply + '㎡ (공급 약 ' + py(l.supply) + '평)'],
        ['층', B.floorDetail(l)], ['입주가능일', l.moveIn],
        ['방 / 욕실', l.rooms + '개 / ' + l.baths + '개'], ['사용승인일(준공)', l.approval], ['주차대수', l.parking],
        ['관리비', '월 약 ' + l.mgmt + '만원'], ['방향', l.dir]])
      .concat(l.school ? [['학군', l.school]] : []);
    document.title = l.cx + ' ' + l.deal + ' ' + price(l) + ' | ' + SITE;
    $('#app').innerHTML = '<a class="lnk" id="bk" href="#">← 목록으로</a>' +
      '<div class="hero" style="margin-top:16px"><div class="meta" style="margin:0 0 14px">' + tags(l) + '</div>' +
      '<h1>' + price(l) + '</h1><p class="lead" style="margin-top:12px">' + esc(l.cx) + ' ' + esc(ptxt(l)) + ' · 전용 ' + l.area + '㎡</p>' +
      (l.tag ? '<p class="sub" style="margin:6px 0 0">' + esc(l.tag) + '</p>' : '') + '</div>' +
      '<div class="card"><table>' + rows.map(function (r) { return '<tr><th>' + r[0] + '</th><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</table></div>' +
      '<h2>중개사 설명</h2><div class="letter"><p style="white-space:pre-wrap">' + esc(l.desc || '-') + '</p></div>' +
      '<h2>이 매물 문의하기</h2><div class="contact">' + kakaoBtn('chat', '카카오톡 오픈채팅으로 문의') +
      '<p style="margin:12px 0 0;font-size:15px">누르면 아래 문구가 복사됩니다. 채팅방에 붙여넣으시면 어떤 매물인지 바로 확인합니다.</p>' +
      '<div class="quote">' + esc(inq(l)) + '</div>' +
      '<div class="acts">' + telBlock('tel', 'telbox', 'cp') + '</div>' +
      '<button class="lnk" id="cplink">이 매물 링크 복사</button></div>' +
      '<h2>이 단지의 다른 ' + l.deal + ' 매물 (' + others.length + ')</h2>' +
      (others.length ? others.map(card).join('') : '<div class="card sub">이 단지에 다른 ' + l.deal + ' 매물이 없습니다.</div>') + brokerCard();
    var root = $('#app');
    bindTel(root, 'tel', 'telbox', 'cp');
    $('#chat').addEventListener('click', function () { askKakao(inq(l)); });
    $('#cplink').onclick = function () { copyText(location.href, '이 매물 링크를 복사했습니다', '주소창의 주소를 직접 복사해 주세요'); };
    bindItems();
  }

  /* ---------- 직접 의뢰하기 팝업 ---------- */
  function openReq() {
    var o = document.createElement('div'); o.className = 'ov';
    o.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="직접 의뢰하기"><div class="top"><h2 style="margin:0">직접 의뢰하기</h2><button class="lnk" id="x">닫기</button></div>' +
      '<p class="sub">찾는 매물이 없거나 직접 상담을 원하시면 편하게 문의해 주세요. 원하는 조건으로 직접 찾아봅니다.</p>' +
      '<div class="acts">' + kakaoBtn('o_chat', '카카오톡 오픈채팅으로 문의') + telBlock('o_tel', 'o_box', 'o_cp') + '</div></div>';
    document.body.appendChild(o);
    var close = function () { o.remove(); };
    o.onclick = function (e) { if (e.target === o) close(); };
    o.querySelector('#x').onclick = close;
    o.querySelector('#o_chat').addEventListener('click', function () { askKakao('[' + SITE + ' 문의] 직접 의뢰'); });
    bindTel(o, 'o_tel', 'o_box', 'o_cp');
  }

  /* ---------- 화면 전환 ---------- */
  function render() { if (tab === 'all') allView(); else home(); }
  function route() {
    var m = /^#listing-(\d+)$/.exec(location.hash);
    var l = m && L.find(function (x) { return x.id === +m[1]; });
    if (l) { detail(l); return; }
    document.title = SITE + ' | 반포·잠원 아파트 매매';
    render();
  }
  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });

  async function boot() {
    $('#app').innerHTML = hero() + '<div class="state">매물을 불러오는 중입니다…</div>';
    try {
      var d = await B.loadData();
      C = d.C; L = d.L; BR = d.B; demo = d.demo;
      route();
      stat('visit', device());
    } catch (e) {
      console.error(e);
      $('#app').innerHTML = hero() + '<div class="card state">매물 정보를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.<br><br><button class="btn inl" id="retry">다시 불러오기</button></div>';
      $('#retry').onclick = boot;
    }
  }
  boot();
})();
</script>
</body>
</html>
